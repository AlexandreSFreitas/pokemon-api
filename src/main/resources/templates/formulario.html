<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Pokémon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1 class="mt-5" th:text="${acao} == null or ${acao} == '/pokemon' ? 'Novo Pokémon' : 'Atualizar Pokémon'">Novo Pokémon</h1>

    <div class="alert alert-danger" th:if="${erros != null}">
        <ul class="mb-0"><li th:each="erro : ${erros}" th:text="${erro}"></li></ul>
    </div>

    <form th:action="${acao} == null ? '/pokemon' : ${acao}" method="post">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" name="nome"
                   th:value="${pokemon} != null ? ${pokemon.nome}" required>
        </div>
        <div class="mb-3">
            <label for="tipo" class="form-label">Tipo</label>
            <input type="text" class="form-control" id="tipo" name="tipo"
                   th:value="${pokemon} != null ? ${pokemon.tipo}" required>
        </div>
        <div class="mb-3">
            <label for="preco" class="form-label">Preço</label>
            <input type="number" class="form-control" id="preco" name="preco" step="0.01" min="0"
                   th:value="${pokemon} != null ? ${pokemon.preco}" required>
        </div>
        <div class="mb-3">
            <label for="dataDeNascimento" class="form-label">Data de Nascimento</label>
            <input type="date" class="form-control" id="dataDeNascimento" name="dataDeNascimento"
                   th:value="${pokemon} != null ? ${pokemon.dataDeNascimento}" required>
        </div>
        <div class="mb-3">
            <label for="dataDeCaptura" class="form-label">Data de Captura</label>
            <input type="date" class="form-control" id="dataDeCaptura" name="dataDeCaptura"
                   th:value="${pokemon} != null ? ${pokemon.dataDeCaptura}" required>
        </div>
        <div class="mb-3">
            <label for="urlImagem" class="form-label">URL da Imagem</label>
            <input type="url" class="form-control" id="urlImagem" name="urlImagem"
                   th:value="${pokemon} != null ? ${pokemon.urlImagem}">
        </div>
        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/pokemon" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
