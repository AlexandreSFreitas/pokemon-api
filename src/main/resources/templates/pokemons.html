<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Pokémons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.2/font/bootstrap-icons.min.css">
</head>
<body>
<div class="container">
    <h1 class="mt-5">Lista de Pokémons</h1>
    <a href="/pokemon/novo" class="btn btn-primary mb-3">Cadastrar Novo Pokémon</a>
    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>Código</th><th>Nome</th><th>Tipo</th><th>Preço</th>
            <th>Data de Nascimento</th><th>Data de Captura</th><th>Imagem</th><th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pokemon : ${pokemons}">
            <td th:text="${pokemon.codigo}"></td>
            <td th:text="${pokemon.nome}"></td>
            <td th:text="${pokemon.tipo}"></td>
            <td th:if="${pokemon.preco != null}"
                th:text="'R$ ' + ${#numbers.formatDecimal(pokemon.preco, 1, 'POINT', 2, 'COMMA')}"></td>
            <td th:unless="${pokemon.preco != null}">-</td>
            <td th:text="${#temporals.format(pokemon.dataDeNascimento, 'dd/MM/yyyy')}"></td>
            <td th:text="${#temporals.format(pokemon.dataDeCaptura, 'dd/MM/yyyy')}"></td>
            <td>
                <img th:src="${pokemon.urlImagem}" alt="Imagem do pokémon" style="width: 50px; height: auto;">
            </td>
            <td>
                <a th:href="@{/pokemon/editar/{id}(id=${pokemon.codigo})}" class="btn btn-warning btn-sm me-1">
                    <i class="bi bi-pencil-square"></i> Editar
                </a>
                <a th:href="@{/pokemon/excluir/{id}(id=${pokemon.codigo})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Tem certeza que deseja excluir este pokémon?');">
                    <i class="bi bi-trash"></i> Excluir
                </a>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(pokemons)}" class="text-muted">Nenhum pokémon cadastrado.</p>
</div>
</body>
</html>
